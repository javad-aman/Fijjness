<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fitness{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <nav class="topnav">
      <a href="/" class="{{ 'active' if active_page == 'today' else '' }}">Today</a>
      <a href="/activity" class="{{ 'active' if active_page == 'activity' else '' }}">Activity</a>
    </nav>
    {% block content %}{% endblock %}
  </div>
  <script src="/static/pace_rail.js"></script>
</body>
</html>
