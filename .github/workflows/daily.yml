name: Daily Garmin sync + coach email

on:
  schedule:
    # ~7:00 AM US Central (UTC-5 during daylight saving / UTC-6 standard time).
    # GitHub Actions cron doesn't follow DST, so this drifts an hour twice a year.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  sync-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin session cache
        uses: actions/cache/restore@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Seed Garmin session on first run
        run: |
          if [ ! -s .garmin_tokens/garmin_tokens.json ]; then
            echo "No cached session found - seeding from GARMIN_TOKENS_SEED_B64 secret"
            mkdir -p .garmin_tokens
            echo "$GARMIN_TOKENS_SEED_B64" | base64 -d > .garmin_tokens/garmin_tokens.json
          fi
        env:
          GARMIN_TOKENS_SEED_B64: ${{ secrets.GARMIN_TOKENS_SEED_B64 }}

      - name: Sync Garmin data to Turso
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m garmin_tracker.sync

      - name: Send coach email
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python -m garmin_tracker.coach_email

      - name: Save Garmin session cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
